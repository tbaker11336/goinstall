<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<title>Installer app site survey</title>
</head>
<body>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0B7A62}
main>*{flex-shrink:0}
.card{background:#FFFFFF;border:1px solid #E4E7EC;border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.h2{margin:0;font-size:15px;font-weight:700}
.ph{aspect-ratio:1;border-radius:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;font-size:11.5px;font-weight:600;box-sizing:border-box;overflow:hidden;font-family:inherit}
.cap{width:100%;padding:6px;background:rgba(255,255,255,0.92);text-align:center;box-sizing:border-box;color:#101828}
.need{border:2px dashed #0B7A62;background:#F3FAF7;color:#075C4A;justify-content:center;gap:4px;cursor:pointer}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-size:13px;font-weight:600;color:#344054}
.input{font:inherit;font-size:15px;min-height:46px;padding:0 12px;border:1px solid #D0D5DD;border-radius:10px;background:#FFFFFF;box-sizing:border-box;color:#101828;width:100%}
.src{font-size:12px;font-weight:600;color:#1849A9}
</style>
<div style="width: 390px; height: 844px; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; color: #101828; background: #F5F6F8; display: flex; flex-direction: column; overflow: hidden">
  <header style="background: #FFFFFF; padding: 16px 20px; border-bottom: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 8px">
    <a href="12-app-my-jobs.html" style="display: inline-flex; align-items: center; gap: 4px; font-size: 14px; font-weight: 600; text-decoration: none; min-height: 32px"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12.5 4.5L7 10l5.5 5.5"></path></svg>My jobs</a>
    <h1 style="margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.02em">Site survey</h1>
    <span style="font-size: 14px; color: #475467">18 Park Road, Wantage · Oliver Grant</span>
    <div style="display: flex; align-items: center; gap: 10px; padding-top: 4px"><div style="flex: 1; height: 8px; background: #EEF0F3; border-radius: 99px; overflow: hidden"><div style="width: 64%; height: 8px; background: #0B7A62; border-radius: 99px"></div></div><span style="font-size: 13px; font-weight: 600; color: #475467">9 of 14</span></div>
  </header>
  <main style="flex: 1; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 12px">
    <section class="card">
      <div style="display: flex; justify-content: space-between; align-items: baseline"><h2 class="h2">Photos</h2><span style="font-size: 13px; color: #667085">4 of 6</span></div>
      <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
        <div class="ph" style="background: linear-gradient(160deg, #C9D6E2, #9FB3C6)"><span class="cap">Front</span></div>
        <div class="ph" style="background: linear-gradient(160deg, #CDBEAF, #A8957F)"><span class="cap">Roof</span></div>
        <div class="ph" style="background: linear-gradient(160deg, #D9D9D6, #B3B3AE)"><span class="cap">Consumer unit</span></div>
        <div class="ph" style="background: linear-gradient(160deg, #DADFD3, #B7C0AA)"><span class="cap">Meter</span></div>
        <button type="button" class="ph need"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h3l1.5-2h6l1.5 2h3v9h-15z"></path><circle cx="10" cy="11" r="3"></circle></svg>Loft</button>
        <button type="button" class="ph need"><svg width="22" height="22" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linejoin="round" aria-hidden="true"><path d="M2.5 6.5h3l1.5-2h6l1.5 2h3v9h-15z"></path><circle cx="10" cy="11" r="3"></circle></svg>Scaffold</button>
      </div>
    </section>
    <section class="card">
      <h2 class="h2">Check on site</h2>
      <div class="field"><label for="s1">Supply</label><input id="s1" class="input" value="100 A · single phase"><span class="src">From online survey · confirm</span></div>
      <div class="field"><label for="s2">Earthing</label><select id="s2" class="input"><option>TN-C-S (PME)</option><option>TN-S</option><option>TT</option></select></div>
      <div class="field"><label for="s3">Scaffold access</label><select id="s3" class="input"><option>Choose…</option><option>Front only</option><option>Front and rear</option><option>Needs neighbour access</option></select></div>
      <div class="field"><label for="s4">Notes</label>
        <div style="position: relative"><textarea id="s4" placeholder="Type or tap the mic to dictate" style="font: inherit; font-size: 15px; width: 100%; min-height: 88px; padding: 12px 52px 12px 12px; border: 1px solid #D0D5DD; border-radius: 10px; resize: vertical; box-sizing: border-box"></textarea>
        <button type="button" aria-label="Dictate notes" style="position: absolute; right: 8px; top: 8px; width: 40px; height: 40px; border-radius: 99px; border: 0; background: #E6F4EF; color: #075C4A; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" aria-hidden="true"><rect x="7" y="2.5" width="6" height="10" rx="3"></rect><path d="M4.5 10a5.5 5.5 0 0 0 11 0M10 15.5v2"></path></svg></button></div>
      </div>
    </section>
  </main>
  <div style="padding: 12px 16px 20px; background: #FFFFFF; border-top: 1px solid #E4E7EC; display: flex; flex-direction: column; gap: 8px">
    <button type="button" style="font: inherit; min-height: 54px; border: 0; background: #0B7A62; color: #FFFFFF; border-radius: 14px; font-size: 16px; font-weight: 700; cursor: pointer">Submit survey</button>
    <span style="font-size: 12.5px; color: #667085; text-align: center">Saved on this phone · syncs when you have signal</span>
  </div>
</div>
</body>
</html>
